<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIC Canvas Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.5.3/jspdf.debug.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#f5f5f5; --surface:#fff; --border:#d0d0d0; --accent:#000; --text:#222; --muted:#888; --warn:#cc3333; --ok:#2a8a2a; }
html,body { height:100%; }
body { background:var(--bg); color:var(--text); font-family:'Open Sans',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { padding:9px 16px 8px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:12px; background:white; flex-shrink:0; }
header h1 { font-size:1.05rem; font-weight:700; letter-spacing:-0.01em; color:var(--accent); }
header span { font-size:0.65rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
.layout { display:flex; flex:1; min-height:0; overflow:hidden; }

.sidebar { width:270px; flex-shrink:0; border-right:1px solid var(--border); overflow-y:auto; padding:10px 12px; background:white; display:flex; flex-direction:column; gap:0; }
.section-label { font-size:0.55rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:3px; margin-bottom:6px; margin-top:11px; }
.section-label:first-child { margin-top:0; }
.field { margin-bottom:5px; }
.field label { display:block; font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
.field input[type="number"], .field select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:'Open Sans',sans-serif; font-size:0.78rem; padding:4px 7px; border-radius:4px; transition:border-color 0.15s; }
.field input[type="number"]:focus, .field select:focus { outline:none; border-color:var(--accent); }
.checkbox-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; font-size:0.65rem; color:var(--text); cursor:pointer; }
.checkbox-row input[type="checkbox"] { width:13px; height:13px; cursor:pointer; accent-color:var(--accent); flex-shrink:0; }
.preset-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:6px; }
.preset-btn { background:var(--bg); border:1px solid var(--border); color:var(--muted); font-family:'Open Sans',sans-serif; font-size:0.6rem; letter-spacing:0.05em; padding:4px 2px; border-radius:4px; cursor:pointer; transition:all 0.15s; text-align:center; }
.preset-btn:hover { border-color:var(--accent); color:var(--accent); }
.preset-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.row2 { display:flex; gap:5px; }
.row2 .field { flex:1; }
.info-box { background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:10px; margin-top:10px; font-size:0.7rem; line-height:1.9; }
.info-row { display:flex; justify-content:space-between; }
.info-row .lbl { color:var(--muted); }
.info-row .val { color:var(--text); }
.info-row .val.warn { color:var(--warn); }
.info-row .val.ok { color:var(--ok); }
.alert { border-radius:4px; padding:7px 9px; font-size:0.67rem; line-height:1.5; margin-top:6px; }
.alert.warn { background:rgba(204,51,51,0.07); border:1px solid rgba(204,51,51,0.3); color:#b02020; }
.alert.ok { background:rgba(42,138,42,0.07); border:1px solid rgba(42,138,42,0.25); color:#1a6a1a; }
.input-reset-wrap { display:flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; background:var(--bg); transition:border-color 0.15s; }
.input-reset-wrap:focus-within { border-color:var(--accent); }
.input-reset-wrap input[type="number"] { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:'Open Sans',sans-serif; font-size:0.78rem; padding:4px 7px; width:0; }
.reset-side-btn { display:none; align-items:center; justify-content:center; width:26px; background:transparent; border:none; border-right:1px solid var(--border); color:var(--muted); font-size:0.9rem; cursor:pointer; transition:background 0.15s,color 0.15s; flex-shrink:0; order:-1; }
.reset-side-btn.visible { display:flex; }
.reset-side-btn:hover { background:var(--accent); color:#fff; }

.vis-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); min-width:0; position:relative; }
.view-toggle { display:flex; margin:12px 0 0 12px; background:white; border:1px solid var(--border); border-radius:20px; padding:3px; flex-shrink:0; position:absolute; top:0; left:0; z-index:10; cursor:pointer; user-select:none; }
.pill-track { position:relative; display:flex; border-radius:16px; overflow:hidden; }
.pill-slider { position:absolute; top:0; left:0; width:50%; height:100%; background:var(--accent); border-radius:16px; transition:transform 0.25s cubic-bezier(0.4,0,0.2,1); z-index:0; }
.pill-slider.right { transform:translateX(100%); }
.view-btn { position:relative; z-index:1; padding:5px 18px; font-family:'Open Sans',sans-serif; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; background:transparent; border:none; color:var(--muted); cursor:pointer; border-radius:16px; transition:color 0.2s; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.view-btn.active { color:#fff; }
.analysis-panel { position:absolute; top:52px; left:12px; z-index:10; background:white; border:1px solid var(--border); border-radius:6px; padding:10px; width:230px; font-size:0.7rem; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
canvas#vis { display:block; width:100%; height:100%; }

.canvas-panel { width:340px; flex-shrink:0; border-left:1px solid var(--border); overflow-y:auto; background:white; display:flex; flex-direction:column; }
.canvas-panel-header { padding:9px 14px 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.canvas-panel-header h2 { font-size:0.75rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
.artwork-toggle-btn { font-size:0.6rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border:1px solid var(--accent); border-radius:20px; background:var(--accent); color:#fff; cursor:pointer; transition:all 0.2s; white-space:nowrap; font-family:'Open Sans',sans-serif; }
.artwork-toggle-btn.off { background:#fff; color:var(--accent); }
.canvas-panel-body { padding:12px; flex:1; display:flex; flex-direction:column; gap:10px; }
.cpanel-section { font-size:0.55rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:3px; margin-bottom:6px; }
.cpanel-field { margin-bottom:6px; }
.cpanel-field label { display:block; font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
.cpanel-field input[type="number"], .cpanel-field input[type="text"] { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:'Open Sans',sans-serif; font-size:0.78rem; padding:4px 7px; border-radius:4px; height:28px; }
.cpanel-field input:focus { outline:none; border-color:var(--accent); }
.cpanel-row { display:flex; gap:6px; }
.cpanel-row .cpanel-field { flex:1; }
.picsplit-toggle { display:flex; align-items:center; gap:8px; margin-bottom:8px; padding:7px 10px; border:1px solid var(--accent); border-radius:6px; cursor:pointer; user-select:none; transition:background 0.2s,color 0.2s; font-size:0.72rem; }
.picsplit-toggle:hover { background:#f5f5f5; }
.picsplit-toggle.active { background:var(--accent); color:#fff; }
.picsplit-toggle .ps-box { width:16px; height:16px; border:2px solid currentColor; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px; font-weight:700; }
.canvas-container { border:1px solid var(--border); background:#aaa; overflow:hidden; }
.split-canvas-wrapper { display:flex; flex-direction:row; width:100%; }
.canvas-half { flex:1; min-width:0; overflow:hidden; }
.canvas-half canvas { display:block; width:100%; height:auto; touch-action:none; user-select:none; }
.split-label { text-align:center; font-size:10px; font-weight:700; letter-spacing:0.08em; color:#fff; background:#444; padding:2px 0; }
canvas.has-image { cursor:grab; }
canvas.dragging { cursor:grabbing; }
.canvas-container canvas { display:block; touch-action:none; user-select:none; cursor:default; width:100%; height:auto; }
.canvas-container canvas.has-image { cursor:grab; }
.canvas-container canvas.dragging { cursor:grabbing; }
.arrow-row { display:flex; gap:4px; margin-bottom:6px; }
.arrow-row button, .action-row button { font-family:'Open Sans',sans-serif; font-size:0.65rem; font-weight:600; padding:5px 8px; border:1px solid var(--accent); border-radius:20px; cursor:pointer; background:#fff; color:var(--accent); transition:all 0.15s; white-space:nowrap; }
.arrow-row button:hover:not(:disabled), .action-row button:hover:not(:disabled) { background:var(--accent); color:#fff; }
.arrow-row button:disabled { opacity:0.35; cursor:not-allowed; }
.arrow-btn-arrow { font-size:1rem; padding:4px 10px; }
.action-row { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
.action-row .btn-green { background:#4CAF50; color:#fff; border-color:#4CAF50; }
.action-row .btn-green:hover { background:#303030; border-color:#303030; }
.action-row .btn-red { background:#FF5733; color:#fff; border-color:#FF5733; }
.action-row .btn-red:hover { background:#303030; border-color:#303030; }
.url-fetch-wrap { display:flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; height:28px; margin-bottom:4px; }
.url-fetch-wrap input { flex:1; border:none; background:var(--bg); font-family:'Open Sans',sans-serif; font-size:0.72rem; padding:0 8px; outline:none; color:var(--text); }
.url-fetch-wrap button { flex:0 0 auto; border:none; border-left:1px solid var(--border); background:#fff; color:var(--text); font-family:'Open Sans',sans-serif; font-size:0.62rem; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; padding:0 10px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:4px; }
.url-fetch-wrap button:hover { background:var(--accent); color:#fff; }
.url-status { font-size:0.6rem; margin-top:2px; min-height:14px; }
.loader { border:4px solid #f3f3f3; border-top:4px solid #3498db; border-radius:50%; width:1rem; height:1rem; animation:spin 1s linear infinite; display:none; margin:4px auto; }
@keyframes spin { 100% { transform:rotate(360deg); } }
.dpi-note { font-size:0.62rem; color:var(--muted); text-align:center; min-height:14px; }
.hidden { display:none !important; }
@media (max-width:900px) { body { overflow:auto; } .layout { flex-direction:column; overflow:visible; } .sidebar,.vis-panel,.canvas-panel { width:100%; height:auto; border:none; border-bottom:1px solid var(--border); } .vis-panel { height:60vw; min-height:300px; } }
</style>
</head>
<body>
<header>
  <h1>PIC CANVAS TOOL</h1>
  <span>Future Automation</span>
</header>
<div class="layout">

  <aside class="sidebar">
    <div class="section-label">Mechanism Preset</div>
    <div class="preset-grid" id="presetGrid"></div>
    <div class="section-label">Moving Frame</div>
    <div class="row2">
      <div class="field"><label>Width (mm)</label><input type="number" id="frameW" value="758" min="10"></div>
      <div class="field"><label>Height (mm)</label><input type="number" id="frameH" value="718" min="10"></div>
    </div>
    <div class="field"><label>Travel (mm)</label><input type="number" id="travel" value="560" min="0"></div>
    <div class="section-label">Canvas (PIC) Size</div>
    <div class="row2">
      <div class="field"><label>Width (mm)</label><input type="number" id="canvW" value="850" min="10"></div>
      <div class="field"><label>Height (mm)</label><input type="number" id="canvH" value="720" min="10"></div>
    </div>
    <div class="field"><label>Canvas Frame Thickness (mm)</label><input type="number" id="canvFrame" value="44" min="1" max="200"></div>
    <label class="checkbox-row" id="hookTopRow">
      <input type="checkbox" id="hookTop" checked>
      <span id="hookTopLabel">Hook canvas to inside top edge of moving frame</span>
    </label>
    <div id="picOnlyFields">
      <div class="section-label">Motor Tube</div>
      <div class="row2">
        <div class="field"><label>Width (mm)</label><div class="input-reset-wrap"><input type="number" id="motorTubeW" min="10"><button class="reset-side-btn" id="motorTubeWReset" title="Reset to default">&#x21BA;</button></div></div>
        <div class="field"><label>Height (mm)</label><div class="input-reset-wrap"><input type="number" id="motorTubeH" min="1"><button class="reset-side-btn" id="motorTubeHReset" title="Reset to default">&#x21BA;</button></div></div>
      </div>
      <div class="field"><label>Motor bottom to frame bottom distance (mm)</label><div class="input-reset-wrap"><input type="number" id="motorOffset" value="35" min="35"><button class="reset-side-btn" id="motorOffsetReset" title="Reset to default (35mm)">&#x21BA;</button></div></div>
      <div class="field"><label id="plateToApertureLabel">Cassette bottom to aperture top — offset (mm)</label><div class="input-reset-wrap"><input type="number" id="motorToApertureOffset" value="0" min="0"><button class="reset-side-btn" id="motorToApertureOffsetReset" title="Reset to 0mm">&#x21BA;</button></div></div>
    </div>
    <div id="sideOnlyFields" class="hidden">
      <div class="section-label">Wall Plate</div>
      <div class="field"><label>Plate to aperture edge — offset (mm)</label><div class="input-reset-wrap"><input type="number" id="sideApertureOffset" value="0"><button class="reset-side-btn" id="sideApertureOffsetReset" title="Reset to 0mm">&#x21BA;</button></div></div>
    </div>
    <div class="section-label">TV / Display</div>
    <div class="field"><label>Select by diagonal</label><select id="tvDiag"></select></div>
    <div class="row2">
      <div class="field"><label>TV Width (mm)</label><input type="number" id="tvW" value="708" min="0"></div>
      <div class="field"><label>TV Height (mm)</label><input type="number" id="tvH" value="398" min="0"></div>
    </div>
    <div class="field"><label>Aperture Thickness (mm)</label><input type="number" id="apertureThick" value="30" min="0"></div>
    <label class="checkbox-row"><input type="checkbox" id="displayAbove"><span id="displayAboveLabel">Mount display above motor tube</span></label>
    <div style="margin-top:9px;">
      <button id="exportProofBtn" style="width:100%;background:#000;color:#fff;border:none;border-radius:4px;padding:9px 0;font-family:'Open Sans',sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:background 0.15s;" onmouseover="this.style.background='#333'" onmouseout="this.style.background='#000'">&#8681; Export Mechanism Proof</button>
    </div>
    <div class="section-label" style="margin-top:14px;">Analysis</div>
    <div class="info-box" id="infoBox"></div>
    <div id="alerts"></div>
  </aside>

  <main class="vis-panel">
    <div class="view-toggle" onclick="togglePosition()" id="pillToggle">
      <div class="pill-track">
        <div class="pill-slider" id="pillSlider"></div>
        <button class="view-btn active" id="btnUp">UP</button>
        <button class="view-btn" id="btnDown">DOWN</button>
      </div>
    </div>
    <canvas id="vis"></canvas>
  </main>

  <section class="canvas-panel">
    <div class="canvas-panel-header">
      <h2>Canvas Generator</h2>
      <button class="artwork-toggle-btn off" id="artworkToggleBtn" disabled style="opacity:0.35;cursor:not-allowed;"><i class="fas fa-eye-slash"></i> Artwork Off</button>
    </div>
    <div class="canvas-panel-body">

      <div>
        <div class="cpanel-section">Artwork Image</div>
        <div class="cpanel-field"><label>Rosenstiels URL</label>
          <div class="url-fetch-wrap">
            <input type="text" id="imgUrl" placeholder="https://www.rosenstiels.com/art/print/...">
            <button id="fetchUrlBtn"><i class="fas fa-link"></i> Fetch</button>
          </div>
          <div class="url-status" id="urlStatus"></div>
        </div>
        <div class="arrow-row">
          <button class="arrow-btn-arrow" id="leftArrow" disabled>&#8592;</button>
          <button class="arrow-btn-arrow" id="rightArrow" disabled>&#8594;</button>
          <button class="arrow-btn-arrow" id="upArrow" disabled>&#8593;</button>
          <button class="arrow-btn-arrow" id="downArrow" disabled>&#8595;</button>
          <button id="upBtn" style="margin-left:auto;"><i class="fas fa-plus"></i> Add Image</button>
          <button id="rmvBtn"><i class="fas fa-trash"></i> Remove</button>
        </div>
        <div class="loader" id="loader"></div>
        <div class="dpi-note" id="dpiNote"></div>
      </div>

      <div>
        <div class="cpanel-section">Export</div>
        <div class="cpanel-field"><label>File Name</label><input type="text" id="fn" placeholder="Eg. CANVAS-1000x1000"></div>
        <div class="action-row">
          <button class="btn-green" id="jpgBtn"><i class="fas fa-image"></i> Artwork Proof</button>
          <button class="btn-red" id="pdfBtn"><i class="fas fa-file-pdf"></i> Canvas PDF</button>
        </div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="cnvSingle"></canvas>
      </div>
      <input type="file" id="imgLdr" accept="image/*" style="display:none">
      <input type="hidden" id="backWrap" value="15">
      <input type="hidden" id="bleed" value="45">
      <input type="hidden" id="guideLen" value="35">
    </div>
  </section>

</div>
<script>
let CANVAS_FRAME = 44;
const FRAME_STROKE = 20;
const PIC_MOTOR_W = 797, PIC_MOTOR_H = 82, PIC_MOTOR_TO_APERTURE = 94;
const PICH_MOTOR_W = 1000, PICH_MOTOR_H = 134, PICH_MOTOR_TO_APERTURE = 79;
const PICSIDE_PLATE_W = 280, PICSIDE_PLATE_H = 650, PICSIDE_PLATE_TO_APERTURE = 44;

const PRESETS = [
  { name:'PIC1',     frameW:758,  frameH:718,  travel:560,  canvW:850,  canvH:720,  type:'pic' },
  { name:'PIC2',     frameW:758,  frameH:868,  travel:710,  canvW:850,  canvH:870,  type:'pic' },
  { name:'PIC3',     frameW:758,  frameH:1018, travel:860,  canvW:850,  canvH:1020, type:'pic' },
  { name:'PIC-H1',   frameW:1012, frameH:910,  travel:710,  canvW:1055, canvH:910,  type:'pich' },
  { name:'PIC-H2',   frameW:1012, frameH:1060, travel:860,  canvW:1055, canvH:1060, type:'pich' },
  { name:'PIC-H3',   frameW:1012, frameH:1210, travel:1010, canvW:1055, canvH:1210, type:'pich' },
  { name:'PIC-SIDE1',frameW:1468, frameH:700,  travel:1184, canvW:1468, canvH:700,  type:'side' },
  { name:'PICSPLIT1', frameW:725, frameH:725,  travel:575,  canvW:725,  canvH:725,  type:'split', splitPlateW:135, splitPlateH:650, splitVMode:'equidistant' },
  { name:'PICSPLIT2', frameW:850, frameH:850,  travel:700,  canvW:850,  canvH:850,  type:'split', splitPlateW:135, splitPlateH:650, splitVMode:'bottom-extend', splitBaseFrameH:725 },
  { name:'PICSPLIT3', frameW:980, frameH:980,  travel:825,  canvW:980,  canvH:980,  type:'split', splitPlateW:135, splitPlateH:830, splitVMode:'equidistant' },
  { name:'PICSPLIT4', frameW:1180,frameH:1140, travel:900,  canvW:1180, canvH:1140, type:'split', splitPlateW:265, splitPlateH:1110,splitVMode:'equidistant' },
];

let animT=0, animTarget=0, animRAF=null, activePreset='PIC1', forcePICH=false, forceSIDE=false;
let motorTubeWOverride=null, motorTubeHOverride=null, motorToApertureOffsetOverride=null, sideApertureOffsetOverride=null;
let activeSplitMeta={ splitPlateW:135, splitPlateH:650, splitVMode:'equidistant', splitBaseFrameH:null };

let upImg=null, imgXOffset=0, imgYOffset=0, isDragging=false, dragStartX=0, dragStartY=0, activeDragCnv=null, intervalId=null;
let isSplit=false, selectedPresetName=null, showArtwork=false;

const container = document.getElementById('canvasContainer');
let cnvLeft = document.getElementById('cnvSingle'), cnvRight=null;

function g(id) { return parseFloat(document.getElementById(id).value)||0; }
function s(id,v) { document.getElementById(id).value=v; }
function getNum(id) { return parseFloat(document.getElementById(id).value)||0; }
function fmt(n) { return Number.isInteger(n)?n.toString():n.toFixed(1); }

function mmToInchStr(mm) {
  const ti=mm/25.4, wi=Math.floor(ti), frac=ti-wi;
  const fs=[[0,''],[1/16,'1/16"'],[1/8,'1/8"'],[3/16,'3/16"'],[1/4,'1/4"'],[5/16,'5/16"'],[3/8,'3/8"'],[7/16,'7/16"'],[1/2,'1/2"'],[9/16,'9/16"'],[5/8,'5/8"'],[11/16,'11/16"'],[3/4,'3/4"'],[13/16,'13/16"'],[7/8,'7/8"'],[15/16,'15/16"'],[1,'']];
  let cl=fs[0], md=Math.abs(frac-fs[0][0]);
  for(const f of fs){const d=Math.abs(frac-f[0]);if(d<md){md=d;cl=f;}}
  let w=wi; if(cl[0]===1)w++;
  const fs2=(cl[0]===0||cl[0]===1)?'':cl[1];
  if(w===0&&fs2)return fs2; if(!fs2)return `${w}"`; return `${w} ${fs2}`;
}
function mmLabel(mm){ return `${fmt(mm)}mm (${mmToInchStr(mm)})`; }

function isSPLIT(){ return activePreset==='PICSPLIT1'||activePreset==='PICSPLIT2'||activePreset==='PICSPLIT3'||activePreset==='PICSPLIT4'; }
function isSIDE(){ return !isSPLIT()&&(forceSIDE||activePreset==='PIC-SIDE1'); }
function isPICH(){ return !isSIDE()&&!isSPLIT()&&(forcePICH||activePreset==='PIC-H1'||activePreset==='PIC-H2'||activePreset==='PIC-H3'); }

function updateSidebarForMode() {
  const side=isSIDE(), split=isSPLIT();
  document.getElementById('picOnlyFields').classList.toggle('hidden',side||split);

function getDims(){
  const cW=getNum('canvW'), cH=getNum('canvH'), sideWrap=getNum('canvFrame'), backWrap=getNum('backWrap'), bleed=getNum('bleed');

  return{cW,cH,sideWrap,backWrap,bleed,imgZone,totalW,totalH,imgAreaX,imgAreaY,imgAreaW,imgAreaH,faceX,faceY,outerCanvW,outerCanvH};
}

function getImgDrawParams(d, side){
  if(!upImg) return null;
  if(side){
    const fullAreaW=(d.cW*2)+(d.imgZone*2), fullAreaH=d.cH+(d.imgZone*2);
    const scl=Math.max(fullAreaW/upImg.width,fullAreaH/upImg.height);
    const sW=upImg.width*scl, sH=upImg.height*scl;
    const centerX=fullAreaW/2+imgXOffset, centerY=fullAreaH/2+imgYOffset;
    const leftBoundary=centerX-sW/2, topBoundary=centerY-sH/2;
    const sideCorrection=side==='right'?d.cW:0;
    return{x:(d.imgAreaX+leftBoundary)-sideCorrection, y:d.imgAreaY+topBoundary, w:sW, h:sH,
           areaX:d.imgAreaX-(side==='right'?d.cW:0), areaY:d.imgAreaY, areaW:d.imgAreaW, areaH:d.imgAreaH};
  }
  const scl=Math.max(d.imgAreaW/upImg.width,d.imgAreaH/upImg.height);
  const sW=upImg.width*scl, sH=upImg.height*scl;
  return{x:d.imgAreaX+(d.imgAreaW-sW)/2+imgXOffset, y:d.imgAreaY+(d.imgAreaH-sH)/2+imgYOffset, w:sW, h:sH,
         areaX:d.imgAreaX, areaY:d.imgAreaY, areaW:d.imgAreaW, areaH:d.imgAreaH};

function getSplitDraw(d,side){ return getImgDrawParams(d,side); }

function drawOneCanvas(cnv,d,side){

  const scale=(isSplit?halfW:container.clientWidth)/d.totalW;
  cnv.width=Math.round(d.totalW*scale); cnv.height=Math.round(d.totalH*scale);
  const ctx=cnv.getContext('2d');

  ctx.fillStyle='#fff'; ctx.fillRect(0,0,d.totalW,d.totalH);
  ctx.fillStyle='#d8d8d8'; ctx.fillRect(d.imgAreaX,d.imgAreaY,d.imgAreaW,d.imgAreaH);

    if(side){const p=getSplitDraw(d,side);if(p)ctx.drawImage(upImg,p.x,p.y,p.w,p.h);}
    else{const scl=Math.max(d.imgAreaW/upImg.width,d.imgAreaH/upImg.height);const sW=upImg.width*scl,sH=upImg.height*scl;ctx.drawImage(upImg,d.imgAreaX+(d.imgAreaW-sW)/2+imgXOffset,d.imgAreaY+(d.imgAreaH-sH)/2+imgYOffset,sW,sH);}

function drawCnv(){
  const d=getDims();
  if(isSplit){drawOneCanvas(cnvLeft,d,'left');drawOneCanvas(cnvRight,d,'right');}
  else{drawOneCanvas(cnvLeft,d,null);}
  updateArrows();

function setupSplitLayout(){
  container.innerHTML='';
  const wrapper=document.createElement('div'); wrapper.className='split-canvas-wrapper';
  ['left','right'].forEach(side=>{
    const half=document.createElement('div'); half.className='canvas-half';
    const lbl2=document.createElement('div'); lbl2.className='split-label'; lbl2.textContent=side==='left'?'LEFT CANVAS':'RIGHT CANVAS';
    const cnv=document.createElement('canvas'); cnv.className='has-image';

function setupSingleLayout(){

  return{x:(src.clientX-rect.left)*(d.totalW/rect.width),y:(src.clientY-rect.top)*(d.totalH/rect.height)};

function attachDrag(cnv,side){
  let startX=0,startY=0,startOffX=0,startOffY=0;
  function onStart(e){
    if(!upImg)return;
    if(e.touches)e.preventDefault();
    isDragging=true; activeDragCnv=cnv;
    const src=e.touches?e.touches[0]:e;
    const rect=cnv.getBoundingClientRect();
    startX=src.clientX-rect.left; startY=src.clientY-rect.top;
    startOffX=imgXOffset; startOffY=imgYOffset;
    cnv.classList.add('dragging');
  }
  function onMove(e){
    if(!isDragging||activeDragCnv!==cnv||!upImg)return;
    if(e.touches)e.preventDefault();
    const src=e.touches?e.touches[0]:e;
    const rect=cnv.getBoundingClientRect();
    const dx=(src.clientX-rect.left)-startX;
    const dy=(src.clientY-rect.top)-startY;
    const d=getDims();
    const mmPerPxX=d.totalW/rect.width;
    const mmPerPxY=d.totalH/rect.height;
    imgXOffset=startOffX+dx*mmPerPxX;
    imgYOffset=startOffY+dy*mmPerPxY;

  const ids=['leftArrow','rightArrow','upArrow','downArrow'];
  if(!upImg){ids.forEach(id=>document.getElementById(id).disabled=true);return;}
  const d=getDims(); let maxX,maxY;
  if(isSplit){const faW=(d.cW*2)+(d.imgZone*2),faH=d.cH+(d.imgZone*2);const scl=Math.max(faW/upImg.width,faH/upImg.height);maxX=(upImg.width*scl-faW)/2;maxY=(upImg.height*scl-faH)/2;}
  else{const scl=Math.max(d.imgAreaW/upImg.width,d.imgAreaH/upImg.height);maxX=(upImg.width*scl-d.imgAreaW)/2;maxY=(upImg.height*scl-d.imgAreaH)/2;}
  document.getElementById('leftArrow').disabled=imgXOffset<=-maxX; document.getElementById('rightArrow').disabled=imgXOffset>=maxX;
  document.getElementById('upArrow').disabled=imgYOffset<=-maxY; document.getElementById('downArrow').disabled=imgYOffset>=maxY;

function stopMoving(){clearInterval(intervalId);intervalId=null;}

['leftArrow','rightArrow','upArrow','downArrow'].forEach(id=>{
  const btn=document.getElementById(id), dir=id.replace('Arrow','');
  btn.addEventListener('click',()=>shiftImage(dir));
  btn.addEventListener('mousedown',()=>startMoving(dir));
  btn.addEventListener('mouseup',stopMoving); btn.addEventListener('mouseleave',stopMoving);

function updateDpiNote(){
  const note=document.getElementById('dpiNote');
  const cW=getNum('canvW'), fH3=getNum('canvH');
  const sideWrap=getNum('canvFrame');
  const imgAreaW=cW+((sideWrap+15)*2), imgAreaH=fH3+((sideWrap+15)*2);
  const reqW=Math.round(imgAreaW/25.4*150), reqH=Math.round(imgAreaH/25.4*150);
  if(upImg){
    const scl=Math.max(imgAreaW/upImg.width,imgAreaH/upImg.height);
    const sWmm=upImg.width*scl, sHmm=upImg.height*scl;
    const dpiW=upImg.width/(Math.min(sWmm,imgAreaW)/25.4), dpiH=upImg.height/(Math.min(sHmm,imgAreaH)/25.4);
    const minDpi=Math.min(dpiW,dpiH), pass=minDpi>=150;
    note.style.color=pass?'#27ae60':'#c0392b';
    note.textContent=`${upImg.width}×${upImg.height}px | ${Math.round(minDpi)}dpi ${pass?'✓':'⚠ below 150dpi'}`;
  } else {
    note.style.color=var_muted;
    note.textContent=`Min size: ${reqW}×${reqH}px`;
  }
}

const PROXIES = [
    u => `https://proxy.will-holdsworth-design.workers.dev/?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`
];

async function fetchTextViaProxies(url) {
    for (const build of PROXIES) {
        try {
            const res = await fetch(build(url), { headers: { 'Accept': 'text/html' } });
            if (res.ok) {
                const text = await res.text();
                if (text) return text;
            }
        } catch (e) {
            continue;
        }
    }
    throw new Error('Page fetch failed: all sources unavailable');
}

function loadImageViaProxies(url, onload, onerror) {
    let i = 0;
    const tryNext = () => {
        if (i >= PROXIES.length) { onerror(); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => onload(img);
        img.onerror = () => { i += 1; tryNext(); };
        img.src = PROXIES[i](url);
    };
    tryNext();
}

document.getElementById('fetchUrlBtn').addEventListener('click',async()=>{
  const raw=document.getElementById('imgUrl').value.trim();
  const statusEl=document.getElementById('urlStatus');
  const loader=document.getElementById('loader');
  if(!raw)return;
  statusEl.style.color='#888'; statusEl.textContent='Fetching page...';
  try{
    const html=await fetchTextViaProxies(raw);
    const canvasM=html.match(/class="canvas"[\s\S]{0,400}<img[^>]+src="([^"]+)"/);
    let imgSrc=canvasM?canvasM[1].trim():null;
    if(!imgSrc){const m=html.match(/src="(https?:\/\/cdn\.felixr\.com\/photos\/[^"]+)"/);if(m)imgSrc=m[1];}
    if(!imgSrc)throw new Error('No artwork image found on page');
    imgSrc=imgSrc.replace(/\/photos\/[^/]+\//,'/photos/500/');
    statusEl.textContent='Loading image...'; loader.style.display='block';
    loadImageViaProxies(imgSrc,(newImg)=>{upImg=newImg;imgXOffset=0;imgYOffset=0;loader.style.display='none';statusEl.style.color='#27ae60';statusEl.textContent='Image loaded';if(!isSplit)cnvLeft.classList.add('has-image');setArtworkToggle(true);drawCnv();draw();updateDpiNote();},()=>{loader.style.display='none';statusEl.style.color='#c00';statusEl.textContent='Could not load image';});
  }catch(err){loader.style.display='none';statusEl.style.color='#c00';statusEl.textContent=err.message||'Failed to fetch image';}
});

function drawMeasurement(ctx,x1,y1,x2,y2,label,type,textPos){
  ctx.save();ctx.strokeStyle='#333';ctx.fillStyle='#333';ctx.lineWidth=1;ctx.font='15px Arial, sans-serif';const tk=5;
  if(type==='h'||type==='iso_h'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2||y1);ctx.stroke();ctx.beginPath();ctx.moveTo(x1,y1-tk);ctx.lineTo(x1,y1+tk);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,(y2||y1)-tk);ctx.lineTo(x2,(y2||y1)+tk);ctx.stroke();if(textPos==='below'){ctx.textAlign='center';ctx.fillText(label,(x1+x2)/2,(y1+(y2||y1))/2+18);}else if(textPos==='above_left'){ctx.textAlign='right';ctx.fillText(label,x1-4,y1+5);}else if(textPos==='above_iso'){ctx.textAlign='center';ctx.fillText(label,(x1+x2)/2,(y1+y2)/2-12);}else{ctx.textAlign='center';ctx.fillText(label,(x1+x2)/2,(y1+(y2||y1))/2-8);}}
  else{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2||x1,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x1-tk,y1);ctx.lineTo(x1+tk,y1);ctx.stroke();ctx.beginPath();ctx.moveTo((x2||x1)-tk,y2);ctx.lineTo((x2||x1)+tk,y2);ctx.stroke();if(textPos==='right'){ctx.textAlign='left';ctx.fillText(label,(x1+(x2||x1))/2+8,(y1+y2)/2+5);}else{ctx.save();ctx.translate((x1+(x2||x1))/2-12,(y1+y2)/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText(label,0,0);ctx.restore();}}
  ctx.restore();
}

function drawQuadImage(ctx,pts,img){
  const[tl,tr,br,bl]=pts,w=img.width,h=img.height;
  function drawTri(p0,p1,p2,uv0,uv1,uv2){const denom=uv0[0]*(uv1[1]-uv2[1])+uv1[0]*(uv2[1]-uv0[1])+uv2[0]*(uv0[1]-uv1[1]);if(Math.abs(denom)<0.0001)return;const a=((p0[0]-p2[0])*(uv1[1]-uv2[1])-(p1[0]-p2[0])*(uv0[1]-uv2[1]))/denom;const b=((p0[1]-p2[1])*(uv1[1]-uv2[1])-(p1[1]-p2[1])*(uv0[1]-uv2[1]))/denom;const c=((p1[0]-p2[0])*(uv0[0]-uv2[0])-(p0[0]-p2[0])*(uv1[0]-uv2[0]))/denom;const ff=((p1[1]-p2[1])*(uv0[0]-uv2[0])-(p0[1]-p2[1])*(uv1[0]-uv2[0]))/denom;const e=p2[0]-a*uv2[0]-c*uv2[1];const g2=p2[1]-b*uv2[0]-ff*uv2[1];ctx.save();ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.closePath();ctx.clip();ctx.transform(a,b,c,ff,e,g2);ctx.drawImage(img,0,0,w,h);ctx.restore();}
  drawTri(tl,tr,bl,[0,0],[w,0],[0,h]);drawTri(tr,br,bl,[w,0],[w,h],[0,h]);
}

function getImgCanvas(d,regionX,regionY,regionW,regionH,flipH,outW,outH,splitSide){
  outW=Math.max(1,Math.round(outW||regionW));outH=Math.max(1,Math.round(outH||regionH));
  const off=document.createElement('canvas');off.width=outW;off.height=outH;
  const oc=off.getContext('2d');
  if(!upImg){oc.fillStyle='#c8c8c8';oc.fillRect(0,0,outW,outH);return off;}
  let drawP;
  if(splitSide){drawP=getSplitDraw(d,splitSide);}
  else{const scl=Math.max(d.imgAreaW/upImg.width,d.imgAreaH/upImg.height);const sW=upImg.width*scl,sH=upImg.height*scl;drawP={x:d.imgAreaX+(d.imgAreaW-sW)/2+imgXOffset,y:d.imgAreaY+(d.imgAreaH-sH)/2+imgYOffset,w:sW,h:sH};}
  const rx=outW/regionW,ry=outH/regionH;
  const dx=(drawP.x-regionX)*rx,dy=(drawP.y-regionY)*ry;
  const dw=drawP.w*rx,dh=drawP.h*ry;
  oc.save();if(flipH){oc.translate(outW,0);oc.scale(-1,1);}
  oc.drawImage(upImg,flipH?-(dx+dw)+outW:dx,dy,dw,dh);oc.restore();
  return off;
}

function drawIsoCanvas(pc,ox,oy,d,fw,fh,sw,th,woodColor,woodDark,woodLight,splitSide,showDepth){
  const topTL=[ox,oy],topTR=[ox+fw,oy],topBR=[ox+fw+sw,oy-th],topBL=[ox+sw,oy-th];
  const sideTL=[ox+fw,oy],sideTR=[ox+fw+sw,oy-th],sideBR=[ox+fw+sw,oy-th+fh],sideBL=[ox+fw,oy+fh];
  pc.save();pc.beginPath();pc.moveTo(topTL[0],topTL[1]);pc.lineTo(topTR[0],topTR[1]);pc.lineTo(topBR[0],topBR[1]);pc.lineTo(topBL[0],topBL[1]);pc.closePath();const tg=pc.createLinearGradient(topTL[0],topTL[1],topBL[0],topBL[1]);tg.addColorStop(0,woodLight);tg.addColorStop(1,woodColor);pc.fillStyle=tg;pc.fill();pc.restore();
  const topImg=getImgCanvas(d,d.faceX,d.bleed+d.backWrap,d.cW,d.sideWrap,false,fw,th,splitSide);drawQuadImage(pc,[topBL,topBR,topTR,topTL],topImg);
  pc.save();pc.beginPath();pc.moveTo(sideTL[0],sideTL[1]);pc.lineTo(sideTR[0],sideTR[1]);pc.lineTo(sideBR[0],sideBR[1]);pc.lineTo(sideBL[0],sideBL[1]);pc.closePath();const sg=pc.createLinearGradient(sideTL[0],0,sideTR[0],0);sg.addColorStop(0,woodDark);sg.addColorStop(1,woodColor);pc.fillStyle=sg;pc.fill();pc.restore();
  const sideImg=getImgCanvas(d,d.totalW-d.bleed-d.backWrap-d.sideWrap,d.faceY,d.sideWrap,d.cH,false,sw,fh,splitSide);drawQuadImage(pc,[sideTL,sideTR,sideBR,sideBL],sideImg);
  const frontImg=getImgCanvas(d,d.faceX,d.faceY,d.cW,d.cH,false,fw,fh,splitSide);pc.save();pc.beginPath();pc.rect(ox,oy,fw,fh);pc.clip();pc.drawImage(frontImg,ox,oy,fw,fh);pc.restore();
  pc.strokeStyle='#00000080';pc.lineWidth=1;pc.strokeRect(ox,oy,fw,fh);pc.beginPath();pc.moveTo(topTL[0],topTL[1]);pc.lineTo(topBL[0],topBL[1]);pc.lineTo(topBR[0],topBR[1]);pc.lineTo(topTR[0],topTR[1]);pc.moveTo(topBR[0],topBR[1]);pc.lineTo(sideBR[0],sideBR[1]);pc.strokeStyle='#00000060';pc.lineWidth=0.8;pc.stroke();
  if(showDepth)drawMeasurement(pc,topTR[0],topTR[1]-10,topBR[0],topBR[1]-10,`${fmt(d.sideWrap)}mm`,'iso_h','above_iso');
}

function drawBackPanel(pc,bx,fy,d,fw,fh,woodColor,splitSide,showEdgeBatten){
  const c=getCalc();
  const batPxW=Math.round(fw*(d.sideWrap/d.cW)),batPxH=Math.round(fh*(d.sideWrap/d.cH));
  const bwPxW=Math.round(fw*(d.backWrap/d.cW)),bwPxH=Math.round(fh*(d.backWrap/d.cH));
  const intPxW=fw-batPxW*2,intPxH=fh-batPxH*2;
  const back=document.createElement('canvas');back.width=fw;back.height=fh;
  const bc=back.getContext('2d');
  const flipped=getImgCanvas(d,d.faceX,d.faceY,d.cW,d.cH,true,fw,fh,splitSide);
  bc.drawImage(flipped,0,0);
  const wr=new Path2D();wr.rect(bwPxW,bwPxH,fw-bwPxW*2,fh-bwPxH*2);wr.rect(batPxW,batPxH,intPxW,intPxH);
  bc.save();bc.clip(wr,'evenodd');bc.fillStyle=woodColor;bc.fillRect(0,0,fw,fh);bc.restore();
  bc.fillStyle='#fff';bc.fillRect(batPxW,batPxH,intPxW,intPxH);
  pc.drawImage(back,bx,fy);
  const bar_mm=CANVAS_FRAME, bar=batPxW;
  const hookTop=c.hookTop, frameH=c.frameH, frameW=c.frameW;
  const canvTopRel_mm=hookTop?-bar_mm:frameH-d.cH-bar_mm;
  const scaleX=fw/d.cW, scaleY=fh/d.cH;
  if(c.needsHorizBrace||c.needsHorizBrace===true){
    const braceY_mm=hookTop?frameH+2+bar_mm/2:-2-bar_mm/2;
    const braceYpx=fy+Math.round((braceY_mm-canvTopRel_mm)*scaleY);
    const bH=Math.round(bar_mm*scaleY);
    pc.save();pc.globalAlpha=0.85;pc.fillStyle=woodColor;
    pc.fillRect(bx+bar,braceYpx-bH/2,fw-bar*2,bH);
    pc.strokeStyle='#9A7340';pc.lineWidth=1;pc.strokeRect(bx+bar,braceYpx-bH/2,fw-bar*2,bH);
    pc.restore();
  }
  if(c.needsVertBrace){
    const frameXpx=splitSide==='left'?fw-bar-Math.round(frameW*scaleX):Math.round(frameW*scaleX);
    const vertX=splitSide==='left'?bx+frameXpx-bar:bx+frameXpx;
    pc.save();pc.globalAlpha=0.85;pc.fillStyle=woodColor;
    pc.fillRect(vertX,fy+bar,bar,fh-bar*2);
    pc.strokeStyle='#9A7340';pc.lineWidth=1;pc.strokeRect(vertX,fy+bar,bar,fh-bar*2);
    pc.restore();
  }
  pc.strokeStyle='#000';pc.lineWidth=1.5;pc.strokeRect(bx,fy,fw,fh);
  const intX1=bx+batPxW,intX2=bx+batPxW+intPxW,intY1=fy+batPxH,intY2=fy+batPxH+intPxH;
  drawMeasurement(pc,intX1,intY1+18,intX2,intY1+18,mmLabel(d.cW-d.sideWrap*2),'h','below');
  const hLineX=intX1+18,tk=5;
  pc.save();pc.strokeStyle='#333';pc.fillStyle='#333';pc.lineWidth=1;
  pc.beginPath();pc.moveTo(hLineX,intY1);pc.lineTo(hLineX,intY2);pc.stroke();
  pc.beginPath();pc.moveTo(hLineX-tk,intY1);pc.lineTo(hLineX+tk,intY1);pc.stroke();
  pc.beginPath();pc.moveTo(hLineX-tk,intY2);pc.lineTo(hLineX+tk,intY2);pc.stroke();
  const hTextY=Math.max(intY1+60,(intY1+intY2)/2);pc.font='15px Arial, sans-serif';
  pc.save();pc.translate(hLineX+20,hTextY);pc.rotate(-Math.PI/2);pc.textAlign='center';pc.fillText(mmLabel(d.cH-d.sideWrap*2),0,0);pc.restore();pc.restore();
  if(showEdgeBatten!==false){const batMidY=fy+Math.round(fh/2);drawMeasurement(pc,bx+fw-batPxW,batMidY,bx+fw,batMidY,mmLabel(d.sideWrap),'h','above_left');}
}

function getProofTitle(fn,presetName){if(fn&&presetName)return`${fn} — ${presetName}`;if(fn)return fn;if(presetName)return presetName;return'';}

function generateSingleProof(d,fn){
  const woodColor='#C8A96E',woodDark='#8B6340',woodLight='#E8C888',MARGIN=80,TOP_H=160,GAP=100;
  const aspect=d.cH>0?d.cW/d.cH:1,frontH=Math.min(480,Math.round(500/aspect)),frontW=Math.round(frontH*aspect);
  const batH=Math.round(frontH*(d.sideWrap/d.cH)),batW=Math.round(frontW*(d.sideWrap/d.cW));
  const thD=Math.max(20,Math.round(batH*0.7)),swD=Math.max(20,Math.round(batW*0.7));
  const isc=0.90,ifw=Math.round(frontW*isc),ifh=Math.round(frontH*isc),isw=Math.round(swD*isc),ith=Math.round(thD*isc);
  const isoTotalW=ifw+isw,isoTotalH=ifh+ith,panelMaxH=Math.max(frontH,isoTotalH),isoLS=Math.round(MARGIN*0.40);
  const TOTAL_W=(MARGIN-isoLS)*2+isoTotalW+GAP+frontW+GAP+frontW+60,TOTAL_H=TOP_H+panelMaxH+140;
  const proof=document.createElement('canvas');proof.width=TOTAL_W;proof.height=TOTAL_H;
  const pc=proof.getContext('2d');pc.fillStyle='#fff';pc.fillRect(0,0,TOTAL_W,TOTAL_H);
  pc.fillStyle='#000';pc.font='bold 26px Arial';pc.textAlign='center';
  const titleStr=getProofTitle(fn,selectedPresetName);
  pc.fillText(titleStr?`${titleStr} — CANVAS PROOF`:'CANVAS PROOF',TOTAL_W/2,46);
  const pY=TOP_H,iX=MARGIN-isoLS,fX=iX+isoTotalW+GAP,bX=fX+frontW+GAP,coI=Math.round((panelMaxH-isoTotalH)/2),coF=Math.round((panelMaxH-frontH)/2);
  drawIsoCanvas(pc,iX+isw,pY+coI+ith,d,ifw,ifh,isw,ith,woodColor,woodDark,woodLight,null,true);
  pc.font='bold 13px Arial';pc.fillStyle='#000';pc.textAlign='center';pc.fillText('ISOMETRIC VIEW',iX+isw+ifw/2,pY+coI+ith+ifh+22);
  const fImg=getImgCanvas(d,d.faceX,d.faceY,d.cW,d.cH,false,frontW,frontH,null);
  pc.save();pc.beginPath();pc.rect(fX,pY+coF,frontW,frontH);pc.clip();pc.drawImage(fImg,fX,pY+coF,frontW,frontH);pc.restore();pc.strokeStyle='#000';pc.lineWidth=1.5;pc.strokeRect(fX,pY+coF,frontW,frontH);
  drawMeasurement(pc,fX,pY+coF-20,fX+frontW,pY+coF-20,mmLabel(d.cW),'h');
  drawMeasurement(pc,fX-20,pY+coF,fX-20,pY+coF+frontH,mmLabel(d.cH),'v');
  pc.font='bold 13px Arial';pc.fillStyle='#000';pc.textAlign='center';pc.fillText('FRONT',fX+frontW/2,pY+coF+frontH+22);
  drawBackPanel(pc,bX,pY+coF,d,frontW,frontH,woodColor,null,false);
  pc.strokeStyle='#000';pc.lineWidth=1.5;pc.strokeRect(bX,pY+coF,frontW,frontH);

(function attachVisDrag(){
  const visCnv=document.getElementById('vis');
  let visDragging=false, visDragStartX=0, visDragStartY=0, visOffsetStartX=0, visOffsetStartY=0;
  let visDragSide=null;

  function getVisCanvasBounds(){
    const c=getCalc();
    const DPR=window.devicePixelRatio||1;
    const cW2=visCnv.parentElement.clientWidth||600, cH2=visCnv.parentElement.clientHeight||500;

    if(isSPLIT()){
      const bar_mm=CANVAS_FRAME;
      const t=animT;
      const gapBetweenPlates_mm=(c.travel+bar_mm)*2;
      const leftPlateRight_mm=c.plateW;
      const rightPlateLeft_mm=leftPlateRight_mm+gapBetweenPlates_mm;
      const leftFrameAt0_mm=leftPlateRight_mm-c.frameW;
      const leftCanvOffX_mm=c.frameW-c.outerCanvW+bar_mm;
      const leftCanvLeft_mm=leftFrameAt0_mm+t*c.travel+leftCanvOffX_mm;
      const rightCanvLeft_mm=rightPlateLeft_mm-t*c.travel-bar_mm;
      const hookTop=c.hookTop;
      const canvTopRel_mm=hookTop?-bar_mm:c.frameH-c.outerCanvH+bar_mm;
      const canvTop_mm=canvTopRel_mm;
      const leftCanvLeft_open=leftFrameAt0_mm+leftCanvOffX_mm;
      const rightCanvRight_open=rightPlateLeft_mm-bar_mm+c.outerCanvW;
      const plateTop_mm=c.splitVMode==='bottom-extend'?((c.splitBaseFrameH||c.frameH)/2-c.plateH/2):(c.frameH/2-c.plateH/2);
      const apertureH_mm=c.apertureH>0?c.apertureH:c.frameH;
      const apertureW_mm=c.apertureW>0?c.apertureW:200;
      const apertureLeft_mm=leftPlateRight_mm+(gapBetweenPlates_mm-apertureW_mm)/2;
      const canvCenterY_mm=canvTop_mm+c.outerCanvH/2;
      const apertureTop_mm=canvCenterY_mm-apertureH_mm/2;
      const fullLeft_mm=Math.min(leftCanvLeft_open,0);
      const fullRight_mm=Math.max(rightCanvRight_open,rightPlateLeft_mm+c.plateW);
      const allTop=Math.min(plateTop_mm,canvTop_mm,apertureTop_mm,0);
      const allBottom=Math.max(plateTop_mm+c.plateH,canvTop_mm+c.outerCanvH,apertureTop_mm+apertureH_mm,c.frameH);
      const DIM_L=60,DIM_R=60,DIM_T=80,DIM_B=70,PAD=30;
      const SCALE=Math.min((cW2-DIM_L-DIM_R-PAD*2)/(fullRight_mm-fullLeft_mm),(cH2-DIM_T-DIM_B-PAD*2)/(allBottom-allTop));
      const sceneW_px=(fullRight_mm-fullLeft_mm)*SCALE, sceneH_px=(allBottom-allTop)*SCALE;
      const originX=DIM_L+PAD+(cW2-DIM_L-DIM_R-PAD*2-sceneW_px)/2-fullLeft_mm*SCALE;
      const originY=DIM_T+(cH2-DIM_T-DIM_B-sceneH_px)/2-allTop*SCALE;
      const lx=originX+leftCanvLeft_mm*SCALE, rx2=originX+rightCanvLeft_mm*SCALE;
      const cy=originY+canvTop_mm*SCALE;
      const ow=c.outerCanvW*SCALE, oh=c.outerCanvH*SCALE;
      return{split:true,scale:SCALE,left:{x:lx,y:cy,w:ow,h:oh},right:{x:rx2,y:cy,w:ow,h:oh}};
    }

    if(isSIDE()){
      const bar_mm=CANVAS_FRAME;
      const hookTop=c.hookTop, mirrorLeft=c.displayAbove;
      const aH=c.tvH>0?c.tvH+c.apertureThick*2:c.frameH, aW2=c.tvW>0?c.tvW+c.apertureThick*2:100;
      const plateW=PICSIDE_PLATE_W;
      const canvTopRel=hookTop?-bar_mm:c.frameH-c.outerCanvH+bar_mm;
      let plateFixedLeft,frameLeftAt0,apertureFixedLeft,canvOffX;
      if(!mirrorLeft){plateFixedLeft=0;frameLeftAt0=plateFixedLeft+plateW-c.frameW;canvOffX=c.frameW-c.outerCanvW+bar_mm;apertureFixedLeft=plateFixedLeft+plateW+c.plateToAperture;}
      else{apertureFixedLeft=0;plateFixedLeft=apertureFixedLeft+aW2+c.plateToAperture;frameLeftAt0=plateFixedLeft;canvOffX=-bar_mm;}
      const frameLeft_mm=frameLeftAt0+(!mirrorLeft?animT*c.travel:-animT*c.travel);
      const canvLeft_mm=frameLeft_mm+canvOffX;
      const canvTop_mm=canvTopRel;
      const canvCenterY=canvTop_mm+c.outerCanvH/2;
      const apertureTop=canvCenterY-aH/2;
      const plateTop=(c.frameH/2)-(PICSIDE_PLATE_H/2);
      const fullLeft=Math.min(plateFixedLeft,apertureFixedLeft,canvLeft_mm,frameLeft_mm);
      const fullRight=Math.max(plateFixedLeft+plateW,apertureFixedLeft+aW2,canvLeft_mm+c.outerCanvW,frameLeft_mm+c.frameW)+animT*c.travel;
      const allTop=Math.min(canvTop_mm,apertureTop,plateTop);
      const allBot=Math.max(canvTop_mm+c.outerCanvH,apertureTop+aH,plateTop+PICSIDE_PLATE_H);
      const SCALE=Math.min((cW2-80)/(fullRight-fullLeft),(cH2-80)/(allBot-allTop))*0.85;
      const origX=cW2/2-((fullLeft+fullRight)/2)*SCALE;
      const origY=cH2/2-((allTop+allBot)/2)*SCALE;
      const cx2=origX+canvLeft_mm*SCALE, cy=origY+canvTop_mm*SCALE;
      const ow=c.outerCanvW*SCALE, oh=c.outerCanvH*SCALE;
      return{split:false,scale:SCALE,left:{x:cx2,y:cy,w:ow,h:oh},right:null};
    }

    const bar=CANVAS_FRAME, hookTop=c.hookTop, displayAbove=c.displayAbove;
    const canvOffY=hookTop?-bar:c.frameH-c.outerCanvH+bar;
    const canvMovedTop=animT*c.travel+canvOffY;
    const aH=c.tvH>0?c.tvH+c.apertureThick*2:60, aW2=c.tvW>0?c.tvW+c.apertureThick*2:100;
    const motorH_mm=c.motorH, motorW_mm=c.motorW, actualMA=c.actualMotorToAperture;
    const motorBottomFixed=c.frameH-c.motorOffset, motorFixedTop=motorBottomFixed-motorH_mm;
    let aFixedTop=displayAbove?motorFixedTop-actualMA-aH:motorBottomFixed+actualMA;
    const canvTopUp=canvOffY, canvBottomDown=c.travel+canvOffY+c.outerCanvH;
    const highestPoint=Math.min(0,canvTopUp,aFixedTop), lowestPoint=Math.max(c.frameH,canvBottomDown,aFixedTop+aH,motorBottomFixed);
    const totalMechH=lowestPoint-highestPoint;
    const PAD=40,LEFT_DIM=80,RIGHT_DIM=140,TOP_PAD_EXTRA=40,BOTTOM_LABEL=50,LABEL_GUARD=50;
    const totalSceneH=totalMechH+PAD*2+TOP_PAD_EXTRA+BOTTOM_LABEL;
    const maxW=Math.max(c.frameW,c.outerCanvW,aW2,motorW_mm)+LEFT_DIM+RIGHT_DIM+PAD*2;
    const SCALE=Math.min((cH2-4-LABEL_GUARD*2)/totalSceneH,(cW2-4)/maxW);
    const cx=cW2/2, originY=(cH2-totalMechH*SCALE)/2+PAD*SCALE+TOP_PAD_EXTRA*SCALE-highestPoint*SCALE+LABEL_GUARD;
    const canvLeft=cx-(c.outerCanvW/2)*SCALE, canvTop=originY+canvMovedTop*SCALE;
    const ow=c.outerCanvW*SCALE, oh=c.outerCanvH*SCALE;
    return{split:false,scale:SCALE,left:{x:canvLeft,y:canvTop,w:ow,h:oh},right:null};
  }

  visCnv.addEventListener('mousedown',e=>{
    if(!upImg||!showArtwork)return;
    const bounds=getVisCanvasBounds();
    const rect=visCnv.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    let hit=null;
    if(bounds.left&&px>=bounds.left.x&&px<=bounds.left.x+bounds.left.w&&py>=bounds.left.y&&py<=bounds.left.y+bounds.left.h) hit='left';
    if(bounds.right&&px>=bounds.right.x&&px<=bounds.right.x+bounds.right.w&&py>=bounds.right.y&&py<=bounds.right.y+bounds.right.h) hit='right';
    if(!hit)return;
    visDragging=true; visDragSide=hit;
    visDragStartX=px; visDragStartY=py;
    visOffsetStartX=imgXOffset; visOffsetStartY=imgYOffset;
    visCnv.style.cursor='grabbing';
    e.preventDefault();
  });

  window.addEventListener('mousemove',e=>{
    if(!visDragging)return;
    const bounds=getVisCanvasBounds();
    const rect=visCnv.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    const dx=px-visDragStartX, dy=py-visDragStartY;
    const d2=getDims();
    const refBounds=bounds.left;
    let refW,refH;
    if(isSPLIT()){refW=d2.cW*2+d2.imgZone*2; refH=d2.cH+d2.imgZone*2;}
    else{refW=d2.imgAreaW; refH=d2.imgAreaH;}
    const pxPerMmX=refBounds.w/refW, pxPerMmY=refBounds.h/refH;
    imgXOffset=visOffsetStartX+dx/pxPerMmX;
    imgYOffset=visOffsetStartY+dy/pxPerMmY;
    const d=getDims();
    clampOffset(d,isSPLIT()?'left':null);
    drawCnv(); draw();
  });

  window.addEventListener('mouseup',()=>{
    if(!visDragging)return;
    visDragging=false; visDragSide=null;
    visCnv.style.cursor='';
  });

  visCnv.addEventListener('mousemove',e=>{
    if(visDragging||!upImg||!showArtwork)return;
    const bounds=getVisCanvasBounds();
    const rect=visCnv.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    const overLeft=bounds.left&&px>=bounds.left.x&&px<=bounds.left.x+bounds.left.w&&py>=bounds.left.y&&py<=bounds.left.y+bounds.left.h;
    const overRight=bounds.right&&px>=bounds.right.x&&px<=bounds.right.x+bounds.right.w&&py>=bounds.right.y&&py<=bounds.right.y+bounds.right.h;
    visCnv.style.cursor=(overLeft||overRight)?'grab':'';
  });

  visCnv.addEventListener('mouseleave',()=>{if(!visDragging)visCnv.style.cursor='';});
})();

buildTVSelector(); buildPresets(); syncMotorTubeFields(); updateSidebarForMode(); updateInfo(); draw(); drawCnv(); updateDpiNote();
